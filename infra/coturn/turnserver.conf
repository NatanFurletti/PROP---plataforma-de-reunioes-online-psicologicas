# Configuração do coturn para desenvolvimento local.
#
# ATENÇÃO — em produção:
#   - trocar user/realm e usar `use-auth-secret` com credenciais efêmeras
#     em vez de usuário fixo (o segredo vaza no bundle do frontend)
#   - habilitar TLS (turns:) com certificado válido
#   - restringir `external-ip` ao IP público real do servidor

listening-port=3478

# Autenticação por credencial de longo prazo.
lt-cred-mech
realm=psiconnect.local
user=psiconnect:psiconnect-turn-dev

# Faixa de portas para os relays de mídia.
min-port=49152
max-port=49200

# Bloqueia relay para endereços internos — sem isto o TURN pode ser usado
# para alcançar serviços da rede privada (SSRF via WebRTC).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Desabilita o CLI de administração por telnet (sem senha por padrão).
no-cli

fingerprint
stale-nonce=600
