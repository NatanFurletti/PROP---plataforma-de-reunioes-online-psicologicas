version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: psiconnect-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-psiconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psiconnect123}
      POSTGRES_DB: ${DB_NAME:-psiconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - psiconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psiconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psiconnect-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-psiconnect}:${DB_PASSWORD:-psiconnect123}@postgres:5432/${DB_NAME:-psiconnect}
      JWT_SECRET: ${JWT_SECRET:-seu_secret_jwt_aqui_muito_seguro_2024}
      JWT_EXPIRES_IN: 8h
      PORT: 3333
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - psiconnect-network
    command: npm run dev

  # Frontend (opcional - para desenvolvimento)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psiconnect-frontend
    environment:
      VITE_API_URL: http://localhost:3333
      VITE_SOCKET_URL: http://localhost:3333
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    networks:
      - psiconnect-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  psiconnect-network:
    driver: bridge
