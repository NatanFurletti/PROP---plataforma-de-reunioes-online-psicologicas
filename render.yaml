# Blueprint do Render: backend (API + sinalização WebSocket).
# Render → New → Blueprint → selecionar este repositório.
services:
  - type: web
    name: psiconnect-api
    runtime: docker
    plan: free
    # Mesma região do banco no Neon (AWS us-east-1) para baixa latência
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string do Neon (direta, sem "-pooler"), com sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # URL do frontend na Vercel, ex.: https://psiconnect.vercel.app
      - key: CLIENT_URL
        sync: false
      # Vercel (rewrite) → proxy do Render → app
      - key: TRUST_PROXY
        value: "2"
      - key: MAX_ROOM_PARTICIPANTS
        value: "6"
      # E-mail transacional (verificação de conta, redefinição de senha).
      # "brevo" exige BREVO_API_KEY e EMAIL_FROM (remetente verificado no Brevo).
      # "resend" exige RESEND_API_KEY e EMAIL_FROM (domínio verificado no Resend).
      # SMTP não serve: o plano grátis do Render bloqueia as portas 25/465/587.
      - key: EMAIL_DRIVER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Ex.: Palas <nao-responda@seudominio.com.br>
      - key: EMAIL_FROM
        sync: false
